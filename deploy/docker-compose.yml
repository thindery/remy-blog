version: '3.8'

services:
  remy-blog:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: remy-blog
    restart: unless-stopped
    # Internal only — public traffic via central nginx on app-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    labels:
      - "traefik.enable=false"

networks:
  app-network:
    external: true
