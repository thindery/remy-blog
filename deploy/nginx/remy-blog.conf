# remylobster.com — static marketing site (Next.js export via nginx container)
# Install/sync to central nginx: /opt/nginx/conf.d/remy-blog.conf
# Baseline: require-cloudflare + security-headers + dynamic upstream (ovh_security_baseline.md)
#
# Wildcard *.remylobster.com serves mini-project testing subdomains until they get
# dedicated vhosts. Do not attach product containers to ops-network.

# Redirect HTTP non-www to HTTPS www
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 80;
    server_name remylobster.com;
    return 301 https://www.remylobster.com$request_uri;
}

# Proxy HTTP www and wildcard subdomains to the remy-blog container
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 80;
    server_name www.remylobster.com;

    location / {
        limit_req zone=public_apps burst=50 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_target remy-blog:80;
        proxy_pass http://$upstream_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTPS non-www to HTTPS www
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 443 ssl;
    http2 on;
    server_name remylobster.com;

    ssl_certificate     /etc/nginx/ssl/remylobster-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/remylobster-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.remylobster.com$request_uri;
}

# Proxy HTTPS www and wildcard subdomains to the remy-blog container
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 443 ssl;
    http2 on;
    server_name www.remylobster.com;

    ssl_certificate     /etc/nginx/ssl/remylobster-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/remylobster-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 20m;

    location / {
        limit_req zone=public_apps burst=50 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_target remy-blog:80;
        proxy_pass http://$upstream_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
