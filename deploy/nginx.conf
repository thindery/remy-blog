server {
    listen 80;
    server_name remylobster.com www.remylobster.com;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # RFC 9116 security.txt (must win over the /\. denylist below)
    location ^~ /.well-known/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Never serve other dotfiles / VCS / env (static export must not mask these)
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* /(package\.json|package-lock\.json|composer\.json|Dockerfile|docker-compose\.ya?ml|\.env.*|terraform\.tfstate.*)$ {
        deny all;
        return 404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check endpoint (container-local; not a substitute for edge health)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Astro static site: real files / .html pages; missing paths → HTTP 404 + 404.html body
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;
    }

    # Security headers (also set at central nginx / Cloudflare — defense in depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Marketing static site: allow Formspree contact POST + Next inline hydration
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;
}
